          - Developed a communication middleware using TCP/UDP and inter-process communication, similar to ROS for use in the ADAS stack. 
          - Formulated strategies to optimize the ADAS stack for real-time performance and implemented them, resulting in a 50% inprovement in resource efficiency.
          - Evaluated various AI capable hardware platforms (NVIDIA Drive AGX, Qualcomm Snapdragon Ride, TI TDA4x, Ambarella) for use in the ADAS stack and provided recommendations to the client based on the evaluation.

