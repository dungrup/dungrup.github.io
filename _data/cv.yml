    Publications:
      - title: "RinneFormer: Transformer based Real-World Cooperative Perception Algorithm"
        authors:
          - D. Hariharan
          - Y. Zhu
          - D. Ungrupulithaya
          - MK. Yoon
          - S. Hollar
        publisher: 2026 IEEE Intelligent Vehicles Symposium (IV)
        releaseDate: 2026
        summary: Introduces RinneFormer, a cooperative 3D object detection framework for connected autonomous vehicles using a Point Transformer Feature Extractor and Localized Context Awareness module, achieving state-of-the-art accuracy on V2XSet and strong generalization to the real-world DAIR-V2X dataset.

      - title: "Q-Loc: Visual Cue-Based Ground Vehicle Localization Using Long Short-Term Memory"
        authors:
          - C. Malinchock
          - J. Yu
          - P. Thapa
          - D. Ungrupulithaya
          - MK. Yoon
        publisher: 2025 IEEE Intelligent Vehicles Symposium (IV)
        releaseDate: 2025
        url: https://doi.org/10.1109/IV64158.2025.11097732
        summary: Proposes a vision-based localization method for autonomous ground robots that detects common landmarks in camera streams and uses LSTM-based recurrent networks to predict vehicle location, prototyped on a small-scale autonomous vehicle platform.

      - title: "AdaptAV: Continuous Adaption of Vision Models for Autonomous Vehicles Using Cloud-based Oracle"
        authors:
          - Y. Zhu
          - D. Ungrupulithaya
          - B. Ge
          - MK. Yoon
        publisher: 2024 IEEE 100th Vehicular Technology Conference (VTC2024-Fall)
        releaseDate: 2024
        url: https://doi.org/10.1109/VTC2024-Fall63153.2024.10757493
        summary: Proposes a system that continuously retrains pruned on-vehicle vision models using a cloud-based oracle model and abundant cloud compute, transmitting improved models back to vehicles to boost inference accuracy over time.

